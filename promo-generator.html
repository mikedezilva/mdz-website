<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelo Studio Promo Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        
        body {
            background-color: #1a1a1a;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* --- SQUARE CANVAS (1080x1080) --- */
        .promo-canvas {
            width: 1080px;
            height: 1080px;
            background-color: #020202;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            transform-origin: top center;
            transform: scale(0.6);
            margin-bottom: -400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        /* --- VERTICAL CANVAS (1080x1920) --- */
        .promo-canvas-vertical {
            width: 1080px;
            height: 1920px;
            background-color: #020202;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            transform-origin: top center;
            transform: scale(0.4);
            margin-bottom: -1100px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(217, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(217, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* SQUARE STYLES */
        .content-layer {
            position: relative;
            z-index: 10;
            padding: 50px 0 50px 50px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .header-section {
            padding-right: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .middle-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            flex: 1;
        }
        .features-column {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .product-image-container {
            width: 600px;
            height: 600px;
            border-left: 2px solid rgba(217, 255, 0, 0.3);
            border-top: 2px solid rgba(217, 255, 0, 0.3);
            border-bottom: 2px solid rgba(217, 255, 0, 0.3);
            box-shadow: -20px 20px 60px rgba(0,0,0,0.6);
            background-color: #fff;
        }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(217, 255, 0, 0.2);
            display: flex;
            align-items: center;
            padding: 0 50px;
            justify-content: space-between;
            z-index: 20;
        }

        /* VERTICAL STYLES */
        .content-layer-vertical {
            position: relative;
            z-index: 10;
            padding: 80px 60px 180px 60px; /* added 180px bottom padding to clear the bottom bar */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* ensures even spacing */
        }
        .product-image-container-vertical {
            width: 100%;
            height: 840px; /* Reduced from 960px to give text more breathing room */
            margin: 40px 0;
            border: 2px solid rgba(217, 255, 0, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            background-color: #fff;
        }
        .product-image-container-vertical img { width: 100%; height: 100%; object-fit: cover; }
        .features-grid-vertical {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px 40px; /* row gap, column gap */
        }

        .mono { font-family: 'Space Mono', monospace; }
        .neon-text { color: #D9FF00; text-shadow: 0 0 10px rgba(217, 255, 0, 0.5); }
        .feature-icon {
            width: 45px;
            height: 45px;
            background-color: rgba(217, 255, 0, 0.1);
            border: 2px solid #D9FF00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #D9FF00;
            flex-shrink: 0;
        }
        
    </style>
</head>
<body>

<div class="w-full flex justify-center mt-10">
    <button onclick="downloadAll()" class="bg-[#D9FF00] hover:bg-white transition-colors text-black px-8 py-4 font-black uppercase text-2xl tracking-widest cursor-pointer shadow-[0_0_20px_rgba(217,255,0,0.4)]">
        <i class="fa-solid fa-download"></i> Download All Images
    </button>
</div>

<h1 class="text-white text-3xl font-mono mt-10 text-center w-full">SQUARE POSTS (1080x1080)</h1>
<div id="square-container" class="flex flex-col gap-40 items-center w-full"></div>

<h1 class="text-white text-3xl font-mono mt-32 mb-10 text-center w-full">VERTICAL POSTS (1080x1920)</h1>
<div id="vertical-container" class="flex flex-col gap-[800px] items-center w-full mb-32"></div>

<script>
    const products = [
        {
            title: "Universe Is <br><span class='neon-text'>Noise</span>",
            edition: "Edition 1 (Transparent)",
            colorText: "Audiophile grade 12\" transparent vinyl.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_202608180458.jpeg"
        },
        {
            title: "Taprobane <br><span class='neon-text'>Trance</span>",
            edition: "Crimson Edition",
            colorText: "Audiophile grade 12\" crimson vinyl.",
            imgSrc: "yelo-store-products/Vinyl_record_album_mockup_202608180458.jpeg"
        },
        {
            title: "Politico <br><span class='neon-text'>Beats Vol 1</span>",
            edition: "Orange Edition",
            colorText: "Commemorative orange pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_with_album_sleeve_202608180458.jpeg"
        },
        {
            title: "Universe Is <br><span class='neon-text'>Noise</span>",
            edition: "Edition 2 (Transparent)",
            colorText: "Audiophile grade 12\" transparent vinyl.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_display_202608180458.jpeg"
        },
        {
            title: "Taprobane <br><span class='neon-text'>Trance</span>",
            edition: "Azure Edition",
            colorText: "Audiophile grade 12\" cyan vinyl pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_and_sleeve_202608180458.jpeg"
        },
        {
            title: "Universe Is <br><span class='neon-text'>Noise</span>",
            edition: "Edition 3 (Transparent)",
            colorText: "Audiophile grade 12\" transparent vinyl.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_displayed_202608180458.jpeg"
        },
        {
            title: "Taprobane <br><span class='neon-text'>Trance</span>",
            edition: "Gold Edition",
            colorText: "Metallic gold pressing with premium sleeve.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_design_202608180458.jpeg"
        }
    ];

    const squareContainer = document.getElementById('square-container');
    const verticalContainer = document.getElementById('vertical-container');

    products.forEach((p, index) => {
        // --- SQUARE HTML ---
        const squareHtml = `
        <div class="promo-canvas" id="square-${index + 1}">
            <div class="cyber-grid"></div>
            <div class="content-layer">
                <div class="header-section mb-6 relative z-20">
                    <div>
                        <div class="mono text-[#D9FF00] text-lg tracking-[0.3em] uppercase mb-3">Sector 03 // The Vault</div>
                        <h1 class="text-7xl font-black uppercase leading-none mb-2">${p.title}</h1>
                        <h2 class="text-3xl font-light text-gray-300">${p.edition}</h2>
                    </div>
                    <div class="text-right border border-[#D9FF00] p-4 bg-black/90 shadow-[0_0_20px_rgba(217,255,0,0.2)]">
                        <div class="mono text-xs text-gray-400 uppercase mb-1">Pre-Order Price</div>
                        <div class="text-5xl font-black text-[#D9FF00]">$99.00</div>
                    </div>
                </div>

                <div class="middle-section">
                    <div class="features-column">
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-record-vinyl"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">Premium 45 RPM</h3>
                                <p class="text-gray-400 text-sm leading-tight">${p.colorText}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-certificate"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">100% Human Creativity</h3>
                                <p class="text-gray-400 text-sm leading-tight">Certified pure analog & human craftsmanship.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-wallet"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">NFT Access Pass</h3>
                                <p class="text-gray-400 text-sm leading-tight">Includes exclusive First Edition digital rights.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">Open Edition (Timed)</h3>
                                <p class="text-gray-400 text-sm leading-tight">Available only until the vault closes.</p>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <div class="inline-flex items-center gap-3 bg-[#D9FF00] hover:bg-white transition-colors text-black px-5 py-3 font-black uppercase text-base tracking-widest cursor-pointer shadow-[0_0_15px_rgba(217,255,0,0.4)] w-max">
                                <i class="fa-solid fa-lock-open"></i> Pre-Order Now
                            </div>
                        </div>
                    </div>

                    <div class="product-image-container">
                        <img src="${p.imgSrc}" alt="${p.title}">
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="flex items-center gap-4 text-xl mono text-[#D9FF00]">
                    <img src="Images/yelo-logo.svg" alt="Yelo Logo" style="height: 24px; filter: drop-shadow(0 0 5px rgba(217,255,0,0.5));">
                    <span>YELOSTUDIO.XYZ</span>
                </div>
                <div class="flex items-center gap-5 text-gray-500 text-2xl">
                    <i class="fa-brands fa-cc-visa"></i>
                    <i class="fa-brands fa-cc-mastercard"></i>
                    <i class="fa-brands fa-bitcoin"></i>
                </div>
            </div>
        </div>
        `;
        squareContainer.insertAdjacentHTML('beforeend', squareHtml);

        // --- VERTICAL HTML ---
        const verticalHtml = `
        <div class="promo-canvas-vertical" id="vertical-${index + 1}">
            <div class="cyber-grid"></div>
            <div class="content-layer-vertical">
                <div class="relative z-20">
                    <div class="mono text-[#D9FF00] text-xl tracking-[0.3em] uppercase mb-4">Sector 03 // The Vault</div>
                    <h1 class="text-8xl font-black uppercase leading-none mb-4">${p.title}</h1>
                    <h2 class="text-4xl font-light text-gray-300">${p.edition}</h2>
                </div>

                <div class="product-image-container-vertical">
                    <img src="${p.imgSrc}" alt="${p.title}">
                </div>

                <div class="features-grid-vertical">
                    <div class="flex items-start gap-4">
                        <div class="feature-icon mt-1"><i class="fa-solid fa-record-vinyl"></i></div>
                        <div>
                            <h3 class="text-xl font-bold uppercase tracking-wider mb-2">Premium 45 RPM</h3>
                            <p class="text-gray-400 text-lg leading-tight">${p.colorText}</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="feature-icon mt-1"><i class="fa-solid fa-certificate"></i></div>
                        <div>
                            <h3 class="text-xl font-bold uppercase tracking-wider mb-2">100% Human Creativity</h3>
                            <p class="text-gray-400 text-lg leading-tight">Certified pure analog craftsmanship.</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="feature-icon mt-1"><i class="fa-solid fa-wallet"></i></div>
                        <div>
                            <h3 class="text-xl font-bold uppercase tracking-wider mb-2">NFT Access Pass</h3>
                            <p class="text-gray-400 text-lg leading-tight">Exclusive First Edition digital rights.</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="feature-icon mt-1"><i class="fa-solid fa-hourglass-half"></i></div>
                        <div>
                            <h3 class="text-xl font-bold uppercase tracking-wider mb-2">Open Edition</h3>
                            <p class="text-gray-400 text-lg leading-tight">Available only until the vault closes.</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-between items-center relative z-20">
                    <div class="inline-flex items-center gap-4 bg-[#D9FF00] hover:bg-white transition-colors text-black px-8 py-5 font-black uppercase text-3xl tracking-widest cursor-pointer shadow-[0_0_20px_rgba(217,255,0,0.4)]">
                        <i class="fa-solid fa-lock-open"></i> Pre-Order Now
                    </div>
                    <div class="text-right border-2 border-[#D9FF00] p-6 bg-black/90 shadow-[0_0_20px_rgba(217,255,0,0.2)]">
                        <div class="mono text-lg text-gray-400 uppercase mb-2">Pre-Order Price</div>
                        <div class="text-7xl font-black text-[#D9FF00]">$99.00</div>
                    </div>
                </div>
            </div>

            <div class="bottom-bar" style="height: 120px; padding: 0 60px;">
                <div class="flex items-center gap-5 text-3xl mono text-[#D9FF00]">
                    <img src="Images/yelo-logo.svg" alt="Yelo Logo" style="height: 32px; filter: drop-shadow(0 0 5px rgba(217,255,0,0.5));">
                    <span>YELOSTUDIO.XYZ</span>
                </div>
                <div class="flex items-center gap-8 text-gray-500 text-5xl">
                    <i class="fa-brands fa-cc-visa"></i>
                    <i class="fa-brands fa-cc-mastercard"></i>
                    <i class="fa-brands fa-bitcoin"></i>
                </div>
            </div>
        </div>
        `;
        verticalContainer.insertAdjacentHTML('beforeend', verticalHtml);
    });

    // --- CAMPAIGN SPECIAL POSTS ---

    // 48 HOUR WARNING - SQUARE
    const warningSquareHtml = `
    <div class="promo-canvas" id="square-warning">
        <div class="cyber-grid" style="background-image: linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);"></div>
        <div class="content-layer" style="justify-content: center; align-items: center; text-align: center;">
            <div class="mono text-red-500 text-2xl tracking-[0.3em] uppercase mb-10 border border-red-500/30 px-6 py-2 bg-red-500/10"><i class="fa-solid fa-triangle-exclamation animate-pulse"></i> CRITICAL ALERT</div>
            <h1 class="text-8xl font-black uppercase leading-none mb-10 text-white">The Vault <br>Closes In</h1>
            <div class="flex gap-8 text-[#D9FF00] font-black text-9xl mono tracking-widest bg-black p-10 border-4 border-[#D9FF00] shadow-[0_0_50px_rgba(217,255,0,0.3)]">
                <div>48<span class="text-3xl block text-gray-500 tracking-normal text-center mt-2">HRS</span></div>
                <div class="animate-pulse">:</div>
                <div>00<span class="text-3xl block text-gray-500 tracking-normal text-center mt-2">MIN</span></div>
            </div>
            <p class="text-3xl text-gray-400 mt-16 max-w-2xl">First Editions will be permanently locked. No represses.</p>
        </div>
    </div>
    `;
    squareContainer.insertAdjacentHTML('beforeend', warningSquareHtml);

    // TEASER - SQUARE
    const teaserSquareHtml = `
    <div class="promo-canvas" id="square-teaser">
        <div class="cyber-grid"></div>
        <div class="content-layer" style="justify-content: center; align-items: center; text-align: center;">
            <div class="mono text-[#D9FF00] text-3xl tracking-[0.5em] uppercase mb-12">Sector 03</div>
            <h1 class="text-9xl font-black uppercase leading-none mb-16 text-white tracking-tighter">The Vault</h1>
            <div class="mono text-4xl text-[#D9FF00] mt-10 flex gap-4 items-center bg-[#D9FF00]/10 px-8 py-4 border border-[#D9FF00]/30">
                <i class="fa-solid fa-lock"></i> ACCESSING SECURE SERVER <span class="animate-pulse">_</span>
            </div>
        </div>
    </div>
    `;
    squareContainer.insertAdjacentHTML('beforeend', teaserSquareHtml);

    // 48 HOUR WARNING - VERTICAL
    const warningVerticalHtml = `
    <div class="promo-canvas-vertical" id="vertical-warning">
        <div class="cyber-grid" style="background-image: linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);"></div>
        <div class="content-layer-vertical" style="justify-content: center; align-items: center; text-align: center;">
            <div class="mono text-red-500 text-3xl tracking-[0.3em] uppercase mb-16 border border-red-500/30 px-8 py-4 bg-red-500/10"><i class="fa-solid fa-triangle-exclamation animate-pulse"></i> FINAL WARNING</div>
            <h1 class="text-[9rem] font-black uppercase leading-none mb-20 text-white">The Vault <br>Closes In</h1>
            <div class="flex gap-8 text-[#D9FF00] font-black text-[12rem] mono tracking-widest bg-black p-12 border-4 border-[#D9FF00] shadow-[0_0_50px_rgba(217,255,0,0.3)]">
                <div>48<span class="text-4xl block text-gray-500 tracking-normal text-center mt-4">HRS</span></div>
                <div class="animate-pulse">:</div>
                <div>00<span class="text-4xl block text-gray-500 tracking-normal text-center mt-4">MIN</span></div>
            </div>
            <p class="text-5xl text-gray-400 mt-32 max-w-3xl leading-relaxed">First Editions will be permanently locked. No represses.</p>
            <div class="absolute bottom-40 w-full flex justify-center">
                 <div class="inline-flex items-center gap-4 bg-[#D9FF00] text-black px-12 py-6 font-black uppercase text-4xl tracking-widest cursor-pointer shadow-[0_0_40px_rgba(217,255,0,0.4)]">
                    <i class="fa-solid fa-lock-open"></i> SECURE YOURS NOW
                </div>
            </div>
        </div>
    </div>
    `;
    verticalContainer.insertAdjacentHTML('beforeend', warningVerticalHtml);

    // TEASER - VERTICAL
    const teaserVerticalHtml = `
    <div class="promo-canvas-vertical" id="vertical-teaser">
        <div class="cyber-grid"></div>
        <div class="content-layer-vertical" style="justify-content: center; align-items: center; text-align: center;">
            <div class="mono text-[#D9FF00] text-4xl tracking-[0.5em] uppercase mb-20">Sector 03</div>
            <h1 class="text-[12rem] font-black uppercase leading-none mb-32 text-white tracking-tighter">The <br>Vault</h1>
            <div class="mono text-5xl text-[#D9FF00] mt-20 flex gap-6 items-center bg-[#D9FF00]/10 px-12 py-6 border border-[#D9FF00]/30">
                <i class="fa-solid fa-lock"></i> SYSTEM LOADING <span class="animate-pulse">_</span>
            </div>
        </div>
    </div>
    `;
    verticalContainer.insertAdjacentHTML('beforeend', teaserVerticalHtml);

    async function downloadAll() {
        const elements = document.querySelectorAll('.promo-canvas, .promo-canvas-vertical');
        for (let i = 0; i < elements.length; i++) {
            const el = elements[i];
            
            // Temporarily remove CSS scale transform to ensure full 1080p rendering
            el.style.transform = 'scale(1)';
            
            const canvas = await html2canvas(el, { 
                scale: 1, 
                backgroundColor: '#020202',
                useCORS: true,
                logging: false
            });
            
            // Restore transform
            el.style.transform = '';
            
            const link = document.createElement('a');
            link.download = `yelo-promo-${el.id}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            // Brief pause to allow the browser to process downloads
            await new Promise(r => setTimeout(r, 800));
        }
    }
</script>

</body>
</html>
