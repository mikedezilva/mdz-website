<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelo Studio Promo Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        
        body {
            background-color: #1a1a1a;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .promo-canvas {
            width: 1080px;
            height: 1080px;
            background-color: #020202;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            transform-origin: top center;
            transform: scale(0.6);
            margin-bottom: -400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(217, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(217, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            padding: 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .mono { font-family: 'Space Mono', monospace; }
        .neon-text { color: #D9FF00; text-shadow: 0 0 10px rgba(217, 255, 0, 0.5); }

        .feature-icon {
            width: 45px;
            height: 45px;
            background-color: rgba(217, 255, 0, 0.1);
            border: 2px solid #D9FF00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #D9FF00;
            flex-shrink: 0;
        }

        .middle-section {
            position: relative;
            margin-top: 20px;
            flex: 1;
        }

        .product-image-container {
            position: absolute;
            right: -60px;
            top: -20px;
            width: 750px;
            height: 750px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: -20px 20px 60px rgba(0,0,0,0.9);
            z-index: 5;
            background-color: #fff;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .features-column {
            position: absolute;
            left: 0;
            top: 20px;
            width: 460px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            /* Cyber panel background to ensure readability over the massive image */
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px;
            border: 1px solid rgba(217, 255, 0, 0.3);
            box-shadow: 20px 20px 40px rgba(0,0,0,0.5);
        }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(217, 255, 0, 0.2);
            display: flex;
            align-items: center;
            padding: 0 60px;
            justify-content: space-between;
            z-index: 20;
        }
    </style>
</head>
<body>

<script>
    const products = [
        {
            title: "Universe Is <br><span class='neon-text'>Noise</span>",
            edition: "Edition 1 (Transparent)",
            colorText: "Audiophile grade 12\" transparent vinyl pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_202608180458.jpeg"
        },
        {
            title: "Taprobane <br><span class='neon-text'>Trance</span>",
            edition: "Crimson Edition",
            colorText: "Audiophile grade 12\" crimson vinyl pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_album_mockup_202608180458.jpeg"
        },
        {
            title: "Politico <br><span class='neon-text'>Beats Vol 1</span>",
            edition: "Orange Edition",
            colorText: "Commemorative orange pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_with_album_sleeve_202608180458.jpeg"
        },
        {
            title: "Universe Is <br><span class='neon-text'>Noise</span>",
            edition: "Edition 2 (Transparent)",
            colorText: "Audiophile grade 12\" transparent vinyl pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_display_202608180458.jpeg"
        },
        {
            title: "Taprobane <br><span class='neon-text'>Trance</span>",
            edition: "Azure Edition",
            colorText: "Audiophile grade 12\" cyan vinyl pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_and_sleeve_202608180458.jpeg"
        },
        {
            title: "Universe Is <br><span class='neon-text'>Noise</span>",
            edition: "Edition 3 (Transparent)",
            colorText: "Audiophile grade 12\" transparent vinyl pressing.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_displayed_202608180458.jpeg"
        },
        {
            title: "Taprobane <br><span class='neon-text'>Trance</span>",
            edition: "Gold Edition",
            colorText: "Metallic gold pressing with premium sleeve.",
            imgSrc: "yelo-store-products/Vinyl_record_mockup_design_202608180458.jpeg"
        }
    ];

    products.forEach((p, index) => {
        const html = `
        <div class="promo-canvas" id="promo-${index + 1}">
            <div class="cyber-grid"></div>
            <div class="content-layer">
                <div class="flex justify-between items-start mb-6 relative z-20">
                    <div>
                        <div class="mono text-[#D9FF00] text-lg tracking-[0.3em] uppercase mb-3">Sector 03 // The Vault</div>
                        <h1 class="text-7xl font-black uppercase leading-none mb-2">${p.title}</h1>
                        <h2 class="text-3xl font-light text-gray-300 drop-shadow-md">${p.edition}</h2>
                    </div>
                    <div class="text-right border border-[#D9FF00] p-4 bg-black/90 backdrop-blur-md shadow-[0_0_20px_rgba(217,255,0,0.2)]">
                        <div class="mono text-xs text-gray-400 uppercase mb-1">Pre-Order Price</div>
                        <div class="text-5xl font-black text-[#D9FF00]">$99.00</div>
                    </div>
                </div>

                <div class="middle-section">
                    <!-- Massive Hero Image -->
                    <div class="product-image-container">
                        <img src="${p.imgSrc}" alt="${p.title}">
                    </div>

                    <!-- Floating Cyber Panel for Features -->
                    <div class="features-column">
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-record-vinyl"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">Premium 45 RPM</h3>
                                <p class="text-gray-400 text-sm">${p.colorText}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-certificate"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">100% Human Creativity</h3>
                                <p class="text-gray-400 text-sm">Certified pure analog & human craftsmanship.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-wallet"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">NFT Access Pass</h3>
                                <p class="text-gray-400 text-sm">Includes exclusive First Edition digital rights.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="feature-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                            <div>
                                <h3 class="text-lg font-bold uppercase tracking-wider mb-1">Open Edition (Timed)</h3>
                                <p class="text-gray-400 text-sm">Available only until the vault closes.</p>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <div class="inline-flex items-center gap-3 bg-[#D9FF00] hover:bg-white transition-colors text-black px-6 py-3 font-black uppercase text-lg tracking-widest cursor-pointer shadow-[0_0_15px_rgba(217,255,0,0.4)]">
                                <i class="fa-solid fa-lock-open"></i> Pre-Order Now
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="flex items-center gap-4 text-xl mono text-[#D9FF00]">
                    <img src="Images/yelo-logo.svg" alt="Yelo Logo" style="height: 24px; filter: drop-shadow(0 0 5px rgba(217,255,0,0.5));">
                    <span>YELOSTUDIO.XYZ</span>
                </div>
                <div class="flex items-center gap-5 text-gray-500 text-2xl">
                    <i class="fa-brands fa-cc-visa"></i>
                    <i class="fa-brands fa-cc-mastercard"></i>
                    <i class="fa-brands fa-bitcoin"></i>
                </div>
            </div>
        </div>
        `;
        document.body.insertAdjacentHTML('beforeend', html);
    });
</script>

</body>
</html>
